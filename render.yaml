# Render Blueprint: the backend as a free Python web service. See docs/DEPLOY.md.
# Every setting comes from environment variables; the ones marked sync: false
# are secrets or per-deployment values that Render asks for when the Blueprint
# is first applied (Dashboard -> service -> Environment to change them later).
services:
  - type: web
    name: secondbrain-api
    runtime: python
    plan: free
    # Fixed when the service is created: pick the region closest to your Neon
    # database (Neon AWS us-east-1 -> virginia, eu-central-1 -> frankfurt,
    # ap-southeast-1 -> singapore, us-west-2 -> oregon).
    region: singapore
    rootDir: backend
    # The embedding model (~90 MB) is downloaded at build time into the build
    # output, since the free plan's disk is wiped on every restart.
    buildCommand: pip install -r requirements.txt && python -m app.services.embedding_service
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FASTEMBED_CACHE_PATH
        value: ./.fastembed_cache
      - key: EMBEDDING_THREADS
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_SIGNUP
        value: "true"
      # Free OpenRouter models (the same as the code defaults); change them here
      # if one disappears from OpenRouter.
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OCR_MODEL
        value: qwen/qwen3.8-27b:free
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
